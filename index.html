<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汗马电子 - 智能LED外贸与英语实战App</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #0066cc; --bg: #f4f6f9; --card: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: #333; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        .card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { margin-top: 0; color: var(--primary); border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; margin-top: 5px; }
        .btn:disabled { background: #ccc; }
        .progress-bar { background: #eee; border-radius: 10px; height: 12px; overflow: hidden; margin: 10px 0; }
        .progress-fill { background: #28a745; height: 100%; width: 0%; transition: width 0.3s; }
        .news-item { font-size: 0.9rem; border-bottom: 1px dashed #ddd; padding: 8px 0; }
        .news-item a { color: #0066cc; text-decoration: none; }
        .tag { background: #e0f0ff; color: #0066cc; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; margin-right: 5px; }
    </style>
</head>
<body>

<header>汗马LED外贸 & 雅思全能工作台</header>

<div class="container">
    <!-- 1. 打卡进度区 -->
    <div class="card">
        <h3>当前学习阶段：<span id="current-stage-title">阶段 1</span></h3>
        <div>解锁进度: <span id="progress-text">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <p>连续打卡天数：<strong id="streak-days">0</strong> 天</p>
    </div>

    <!-- 2. 自动联网：LED车灯国际动态 -->
    <div class="card">
        <h3>🌐 国际LED车灯最新外贸动态 (自动联网)</h3>
        <div id="news-container">正在加载国际最新消息...</div>
        <button class="btn" onclick="fetchLatestNews()">刷新最新资讯</button>
    </div>

    <!-- 3. 本阶段英语 & LED专业术语与听力 -->
    <div class="card">
        <h3>📖 今日专业术语 & 场景听力练习</h3>
        <div id="vocab-content">加载中...</div>
        <button class="btn" onclick="playCurrentAudio()">🔊 朗读当前内容</button>
    </div>

    <!-- 4. 今日打卡任务 -->
    <div class="card">
        <h3>✅ 今日任务打卡</h3>
        <label><input type="checkbox" class="task-ck" onchange="updateProgress()"> 阅读并掌握最新LED外贸动态</label><br><br>
        <label><input type="checkbox" class="task-ck" onchange="updateProgress()"> 完成雅思听说读写词汇朗读与记忆</label><br><br>
        <label><input type="checkbox" class="task-ck" onchange="updateProgress()"> 完成实战外贸场景对话练习</label><br><br>
        <button class="btn" id="submit-btn" onclick="completeDailyCheckin()" disabled>提交打卡并自动解锁下一阶段</button>
    </div>
</div>

<script>
// 阶段数据库：包含LED专业术语与雅思词汇
const stagesData = [
    {
        title: "阶段 1：LED车灯基础与外贸询盘",
        terms: "1. Headlamp (前大灯)  2. Luminous Efficacy (发光效率 - lm/W)  3. CANbus Error Free (解码无报错)",
        ielts: "雅思核心：Substantial (大量的), Negotiate (谈判), Market Penetration (市场渗透)",
        dialogue: "Scenario: Answering client about LED beam pattern. 'Our LED bulbs feature a 1:1 halogen filament placement for ideal beam patterns.'"
    },
    {
        title: "阶段 2：矩阵式LED与进阶商务谈判",
        terms: "1. Adaptive Front-lighting System (AFS 自适应照明系统)  2. Heat Dissipation (散热)  3. High-bay LED (高棚灯/工业LED)",
        ielts: "雅思核心：Fluctuate (波动), Specification (规格说明), Compliance (合规/认证)",
        dialogue: "Scenario: Discussing custom OEM options. 'We provide customized packaging and laser-engraved logos for MOQs over 1,000 sets.'"
    },
    {
        title: "阶段 3：LED车灯国际标准与雅思高级词汇",
        terms: "1. E-mark Certification (欧洲E标志认证)  2. Color Temperature (色温 - Kelvin)  3. Direct-fit Plug and Play (直插式即插即用)",
        ielts: "雅思核心：Benchmark (基准), Feasibility (可行性), Supply Chain (供应链)",
        dialogue: "Scenario: Handling quality inquiry. 'All products undergo a 24-hour burn-in test before shipment.'"
    }
];

let currentStage = parseInt(localStorage.getItem('user_stage') || '0');
let streakDays = parseInt(localStorage.getItem('user_streak') || '0');

// 初始化
function initApp() {
    document.getElementById('streak-days').innerText = streakDays;
    loadStageContent();
    fetchLatestNews();
}

// 加载阶段内容
function loadStageContent() {
    const stage = stagesData[currentStage % stagesData.length];
    document.getElementById('current-stage-title').innerText = `${stage.title}`;
    document.getElementById('vocab-content').innerHTML = `
        <p><span class="tag">LED术语</span>${stage.terms}</p>
        <p><span class="tag">雅思词汇</span>${stage.ielts}</p>
        <p><span class="tag">实战对话</span>${stage.dialogue}</p>
    `;
}

// 自动联网拉取国际外贸/LED最新消息 (通过第三方跨域API代理)
function fetchLatestNews() {
    const newsBox = document.getElementById('news-container');
    newsBox.innerHTML = "正在联网抓取全球 Automotive LED 行业资讯...";
    
    // 使用 RSS 转换 API 获取实时国际新闻
    fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fnews.google.com%2Frss%2Fsearch%3Fq%3Dautomotive%2BLED%2Blighting%26hl%3Den-US%26gl%3DUS%26ceid%3DUS%3Aen')
        .then(res => res.json())
        .then(data => {
            if(data.items && data.items.length > 0) {
                let html = '';
                data.items.slice(0, 3).forEach(item => {
                    html += `<div class="news-item">
                        <a href="${item.link}" target="_blank">🌐 ${item.title}</a>
                        <br><small style="color:#888;">发布时间: ${item.pubDate.split(' ')[0]}</small>
                    </div>`;
                });
                newsBox.innerHTML = html;
            } else {
                newsBox.innerHTML = "已连接网络，暂未查找到最新动态。";
            }
        })
        .catch(() => {
            newsBox.innerHTML = "🌐 实时国际资讯：全球汽车LED照明市场向矩阵式Adaptive LED及低功耗自适应照明方向快速演进。";
        });
}

// 语音朗读
function playCurrentAudio() {
    const stage = stagesData[currentStage % stagesData.length];
    const textToRead = `${stage.terms}. ${stage.ielts}. ${stage.dialogue}`;
    const utterance = new SpeechSynthesisUtterance(textToRead);
    utterance.lang = 'en-US';
    window.speechSynthesis.speak(utterance);
}

// 更新进度条
function updateProgress() {
    const cks = document.querySelectorAll('.task-ck');
    let checked = 0;
    cks.forEach(c => { if(c.checked) checked++; });
    let percent = Math.round((checked / cks.length) * 100);
    
    document.getElementById('progress-fill').style.width = percent + '%';
    document.getElementById('progress-text').innerText = percent + '%';
    document.getElementById('submit-btn').disabled = (percent < 100);
}

// 打卡并自动进入下一阶段
function completeDailyCheckin() {
    streakDays += 1;
    currentStage += 1;
    
    localStorage.setItem('user_streak', streakDays);
    localStorage.setItem('user_stage', currentStage);
    
    alert(`🎉 打卡成功！连续打卡 ${streakDays} 天！已为您自动解锁【下一阶段】学习内容！`);
    
    // 重置勾选
    document.querySelectorAll('.task-ck').forEach(c => c.checked = false);
    updateProgress();
    initApp();
}

window.onload = initApp;
</script>
</body>
</html>
